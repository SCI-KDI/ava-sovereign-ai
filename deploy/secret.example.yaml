# Example Secret for deploy/values.example.yaml. Do not commit a filled copy.
# Prefer creating it from your secret manager, or with kubectl:
#   kubectl create secret generic ava-secrets \
#     --from-literal=webui-secret-key="$(openssl rand -hex 32)" \
#     --from-literal=database-url='postgresql://ava:<password>@<postgres-host>:5432/ava' \
#     ...
apiVersion: v1
kind: Secret
metadata:
  name: ava-secrets
type: Opaque
stringData:
  webui-secret-key: "<output of: openssl rand -hex 32>"
  database-url: "postgresql://ava:<password>@<postgres-host>:5432/ava"
  redis-url: "redis://default:<password>@<redis-host>:6379/0"
  websocket-redis-url: "redis://default:<password>@<redis-host>:6379/1"
  llm-api-key: "<API token of your model provider>"
  oidc-client-id: "<client ID registered with your identity provider>"
  oidc-client-secret: "<client secret>"
